<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172d2a"><title>The Scent of a Teacher</title><style>
:root{--bg:#f6f3ec;--ink:#20322e;--muted:#66736c;--gold:#ad8750;--line:#d9d7ca;--white:#fffdf8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;line-height:1.55}main{max-width:720px;margin:auto;min-height:100dvh;padding:28px 22px 75px}.eyebrow{font:600 11px/1.5 system-ui,sans-serif;letter-spacing:.23em;text-transform:uppercase;color:var(--gold)}h1{font-size:clamp(42px,9vw,68px);font-weight:400;line-height:1.08;margin:16px 0}h2{font-size:clamp(29px,6vw,43px);line-height:1.2;font-weight:400;margin:15px 0 20px}p{font-size:17px}.muted{color:var(--muted)}.hero{padding-top:13vh}.line{height:1px;background:var(--line);margin:30px 0}.bottle{width:115px;height:160px;margin:25px auto 35px;position:relative;background:linear-gradient(120deg,#d1d4bc99,#e8ddbb,#9db7a599);border:2px solid #9da99b;border-radius:12px 12px 20px 20px;box-shadow:inset 8px 0 20px #fff8,12px 15px 35px #172d2a19}.bottle:before{content:'';position:absolute;width:54px;height:31px;top:-31px;left:29px;background:#233e36;border-radius:4px 4px 0 0}.bottle:after{content:'ATELIER';position:absolute;top:69px;left:13px;width:85px;text-align:center;font:10px system-ui;letter-spacing:2px;color:#334b40;border-block:1px solid #ffffff90;padding:9px 0}.btn{width:100%;border:0;border-radius:3px;padding:17px 20px;background:#213c34;color:white;font:600 13px system-ui,sans-serif;letter-spacing:.08em;cursor:pointer}.btn.secondary{background:transparent;color:var(--ink);border:1px solid #88978d}.btn:disabled{opacity:.4}.buttons{display:flex;gap:10px;margin-top:25px}.buttons .btn{flex:1}.option{display:block;text-align:left;width:100%;background:var(--white);border:1px solid var(--line);border-radius:5px;padding:17px 17px;margin:10px 0;font:16px/1.5 system-ui,sans-serif;color:var(--ink);cursor:pointer}.option.selected{border:2px solid #466a5d;background:#e9eee6;padding:16px}.progress{height:4px;background:#e3e1d7;margin:22px 0 32px;border-radius:4px;overflow:hidden}.progress>div{height:100%;background:#8d9f87;transition:width .25s}.count{font:12px system-ui,sans-serif;color:var(--muted)}.pill{display:inline-block;font:12px system-ui,sans-serif;padding:7px 10px;border:1px solid var(--line);margin:4px 5px 4px 0;border-radius:30px}.result{border:1px solid var(--line);padding:25px 22px;background:var(--white)}.notegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}.note{background:#eaece4;padding:14px 8px;text-align:center;font:14px system-ui,sans-serif}.note small{display:block;color:var(--muted);font-size:10px;letter-spacing:.1em;margin-bottom:7px}.reflection{border-left:3px solid var(--gold);padding-left:18px;font-style:italic}.hide{display:none}.footer{font:12px/1.6 system-ui,sans-serif;color:var(--muted);margin-top:35px}button:focus-visible{outline:3px solid #ad8750;outline-offset:3px}@media(max-width:400px){.notegrid{grid-template-columns:1fr}.note{padding:10px}}
</style></head><body><main id="app" aria-live="polite"></main><script>
const profiles={awakener:{name:'The Awakener',tag:'You open doors to wonder.',desc:'You believe curiosity is the beginning of learning. You invite questions, make ideas accessible and help students see new possibilities.',strength:'Making learning feel alive and worth exploring',reflect:'When might a little more structure help curiosity lead to deeper understanding?',base:['Bergamot','Green Tea','Cedarwood']},anchor:{name:'The Anchor',tag:'You make courage possible.',desc:'You create stability and trust. You believe students learn best when they feel secure enough to take risks and recover from setbacks.',strength:'Building confidence through consistency and care',reflect:'When could stepping back allow students to discover their own resilience?',base:['Cardamom','Sandalwood','Amber']},architect:{name:'The Architect',tag:'You build foundations that last.',desc:'You value clarity, progression and purposeful learning. You make complex ideas manageable and give students the tools to succeed.',strength:'Turning intentions into thoughtful learning experiences',reflect:'Where might an unexpected detour enrich your carefully designed lesson?',base:['Bergamot','Cedarwood','Vetiver']},nurturer:{name:'The Nurturer',tag:'You notice what others might miss.',desc:'You see the individual behind the learner. You believe belonging, empathy and relationships make meaningful growth possible.',strength:'Helping every learner feel seen and valued',reflect:'How might you pair compassion with a challenge that stretches students?',base:['Pear','Jasmine','White Musk']},catalyst:{name:'The Catalyst',tag:'You help possibility become action.',desc:'You believe growth comes from trying, questioning and stretching boundaries. You bring energy and invite students to rethink what is possible.',strength:'Creating momentum and confidence to try',reflect:'When might slowing down help students make sense of a bold new idea?',base:['Grapefruit','Ginger','Amberwood']},explorer:{name:'The Explorer',tag:'You take learning beyond the familiar.',desc:'You value discovery, experience and real-world connections. You invite students to investigate and make meaning for themselves.',strength:'Connecting learning with the wider world',reflect:'How might you consolidate discoveries so every learner takes away a clear understanding?',base:['Bamboo Leaf','Sea Salt','Driftwood']}};
// Each teaching question has six positive, plausible choices. Each choice scores one distinct teaching orientation.
const T=[
['A student asks a question that takes your lesson in an unexpected direction. You…',[['Invite everyone to wonder what might be happening.','awakener'],['Reassure students that unusual questions are welcome.','anchor'],['Connect it to the lesson goal and plan a follow-up.','architect'],['Draw in students who have not yet spoken.','nurturer'],['Turn it into a bold challenge to test.','catalyst'],['Let the class investigate where the question leads.','explorer']]],
['A student has struggled for weeks and finally makes progress. What delights you most?',[['They are eager to ask another question.','awakener'],['They now believe they can succeed.','anchor'],['The next step is finally within reach.','architect'],['They feel proud and understood.','nurturer'],['They are ready to tackle something harder.','catalyst'],['They want to apply it somewhere new.','explorer']]],
['You have an unexpected free lesson. You would most enjoy…',[['A fascinating demonstration that sparks questions.','awakener'],['A calm session to rebuild confidence and routines.','anchor'],['A focused activity to strengthen key understanding.','architect'],['A class conversation about how everyone is doing.','nurturer'],['A creative challenge with surprising solutions.','catalyst'],['A walk to investigate something outside the classroom.','explorer']]],
['A group project is not going well. Your first instinct is to…',[['Ask what they are curious about in the problem.','awakener'],['Help them feel safe enough to try again.','anchor'],['Break the task into clear, manageable steps.','architect'],['Check whether everyone feels heard.','nurturer'],['Challenge the group to rethink its approach.','catalyst'],['Encourage a new trial with real-world materials.','explorer']]],
['A colleague asks what makes a lesson memorable. You say…',[['The moment a child asks a wonderful question.','awakener'],['The moment a child realises they can do it.','anchor'],['The moment the pieces finally fit together.','architect'],['The moment a child feels they belong.','nurturer'],['The moment students surprise themselves.','catalyst'],['The moment learning connects with life.','explorer']]],
['You are designing a new learning space. Your first priority is…',[['A corner full of intriguing prompts and discoveries.','awakener'],['A welcoming environment with predictable routines.','anchor'],['Flexible zones with clear purposes and resources.','architect'],['Places where every child can participate comfortably.','nurturer'],['A workshop area for making and testing ideas.','catalyst'],['Easy access to authentic materials and outdoor learning.','explorer']]],
['A quiet student offers an unusual idea. You…',[['Ask an inviting question to develop their thinking.','awakener'],['Affirm the courage it took to speak up.','anchor'],['Help clarify the reasoning behind the idea.','architect'],['Make space for their voice without pressure.','nurturer'],['Encourage the class to try the idea out.','catalyst'],['Ask how the idea could work in the real world.','explorer']]],
['When planning a difficult unit, you start by…',[['Finding a big question worth exploring.','awakener'],['Anticipating where students may lose confidence.','anchor'],['Mapping the learning progression carefully.','architect'],['Thinking about the learners who need extra support.','nurturer'],['Designing a challenge that makes them stretch.','catalyst'],['Looking for a real-life experience to anchor learning.','explorer']]],
['Your class disagrees about an answer. You…',[['Invite them to pose better questions.','awakener'],['Establish that mistakes and disagreement are safe.','anchor'],['Guide them to evaluate evidence systematically.','architect'],['Ensure different voices are respected.','nurturer'],['Set up a quick test to challenge assumptions.','catalyst'],['Encourage them to investigate beyond the textbook.','explorer']]],
['At the end of the school year, you hope students remember…',[['The joy of asking why.','awakener'],['That they were capable even when things were hard.','anchor'],['How to think clearly and learn independently.','architect'],['That someone truly believed in them.','nurturer'],['That they can make a difference.','catalyst'],['That learning is everywhere.','explorer']]],
['A new teacher asks for one piece of advice. You suggest…',[['Keep your own sense of wonder alive.','awakener'],['Be consistent; trust takes time.','anchor'],['Know what students need to learn and why.','architect'],['Get to know the children first.','nurturer'],['Be brave enough to experiment.','catalyst'],['Look beyond the classroom walls.','explorer']]],
['When a lesson does not go as planned, you are most likely to…',[['Revisit the questions students were asking.','awakener'],['Restore confidence and try again tomorrow.','anchor'],['Analyse where the learning broke down.','architect'],['Listen to how students experienced it.','nurturer'],['Redesign the activity with a different approach.','catalyst'],['Seek a new context or hands-on experience.','explorer']]]
];
const S=[
['Which opening feels most inviting?',[['Sparkling citrus and crisp fruit','bright'],['Fresh leaves and cool morning air','green'],['Soft petals and gentle florals','floral'],['Warm spice and a hint of sweetness','warm']]],
['Which atmosphere would you enjoy wearing?',[['Clean and breezy, like the coast','aquatic'],['Calm and leafy, like a garden','green'],['Comforting and cosy, like warm wood','warm'],['Lively and radiant, like sunshine','bright']]],
['Which base feels most like you?',[['Smooth woods with a quiet finish','woody'],['Clean, soft musk','clean'],['Rich amber and gentle vanilla','warm'],['Airy driftwood and mineral notes','aquatic']]],
['How would you prefer your perfume to be noticed?',[['Light and close to the skin','light'],['Fresh and noticeable, but not loud','fresh'],['Balanced with a lingering woody trail','balanced'],['Warm and expressive','rich']]]
];
let answers=Array(16).fill(null),step=-1;
const app=document.getElementById('app');
function render(){window.scrollTo(0,0);if(step===-1){app.innerHTML=`<section class="hero"><div class="eyebrow">An educator's fragrance atelier</div><div class="bottle" aria-hidden="true"></div><h1>The Scent<br>of a Teacher</h1><p>Every teacher leaves an impression. What is yours?</p><p class="muted">Explore your teaching beliefs, discover your signature fragrance character, and take away a question worth reflecting on.</p><div class="line"></div><p class="count">16 questions · About 5 minutes · No data collected</p><button class="btn" id="start">DISCOVER MY SCENT</button><p class="footer">A creative reflection experience, not a validated personality assessment. Your fragrance preferences are asked separately from your teaching beliefs.</p></section>`;document.getElementById('start').onclick=()=>{step=0;render()};return}
if(step===16){result();return}const teaching=step<12,q=teaching?T[step]:S[step-12];app.innerHTML=`<div class="eyebrow">${teaching?'Part I · The teacher within':'Part II · Your scent preferences'}</div><div class="progress"><div style="width:${step/16*100}%"></div></div><div class="count">Question ${step+1} of 16</div><h2>${q[0]}</h2><div id="opts"></div><div class="buttons"><button class="btn secondary" id="back">BACK</button><button class="btn" id="next" ${answers[step]===null?'disabled':''}>${step===15?'REVEAL MY SCENT':'CONTINUE'}</button></div><p class="footer">Choose the response that feels most natural. There are no right or wrong answers.</p>`;const opts=document.getElementById('opts');q[1].forEach((o,i)=>{const b=document.createElement('button');b.className='option'+(answers[step]===i?' selected':'');b.textContent=o[0];b.setAttribute('aria-pressed',answers[step]===i?'true':'false');b.onclick=()=>{answers[step]=i;renderNoScroll()};opts.appendChild(b)});document.getElementById('back').onclick=()=>{step--;render()};document.getElementById('next').onclick=()=>{if(answers[step]!==null){step++;render()}}}
function renderNoScroll(){const y=window.scrollY;render();window.scrollTo(0,y)}
function result(){const scores=Object.fromEntries(Object.keys(profiles).map(k=>[k,0]));for(let i=0;i<12;i++)scores[T[i][1][answers[i]][1]]++;const ranked=Object.keys(scores).sort((a,b)=>scores[b]-scores[a]||Object.keys(profiles).indexOf(a)-Object.keys(profiles).indexOf(b));const p=ranked[0],secondary=ranked[1],pr=profiles[p];const prefs=S.map((q,i)=>q[1][answers[i+12]][1]);let notes=[...pr.base];const top={bright:'Green Apple',green:'Bamboo Leaf',floral:'Neroli',warm:'Cardamom'};const heart={aquatic:'Sea Salt',green:'Green Tea',warm:'Ginger',bright:'Grapefruit'};const base={woody:'Cedarwood',clean:'White Musk',warm:'Amber',aquatic:'Driftwood'};notes=[top[prefs[0]],heart[prefs[1]],base[prefs[2]]];const intensity={light:'Soft and intimate',fresh:'Fresh and easy to wear',balanced:'Balanced and lingering',rich:'Warm and expressive'}[prefs[3]];const title=pr.name;const summary=`${title} with ${profiles[secondary].name} influence. Top: ${notes[0]}. Heart: ${notes[1]}. Base: ${notes[2]}. Style: ${intensity}.`;app.innerHTML=`<div class="eyebrow">Your fragrance portrait</div><div class="result"><div class="bottle" aria-hidden="true"></div><div class="eyebrow">Your teaching identity</div><h1 style="font-size:45px">${title}</h1><p><em>${pr.tag}</em></p><p>${pr.desc}</p><p class="muted">With a touch of <strong>${profiles[secondary].name}</strong> — your secondary influence.</p><div class="line"></div><div class="eyebrow">Your signature fragrance</div><h2 style="font-size:30px">A scent shaped by you</h2><div class="notegrid"><div class="note"><small>TOP</small>${notes[0]}</div><div class="note"><small>HEART</small>${notes[1]}</div><div class="note"><small>BASE</small>${notes[2]}</div></div><p><strong>Wearing style:</strong> ${intensity}</p><p class="muted">These are a creative note pyramid, not a ready-to-mix perfume formula. Ask a perfumer to check available accords, concentrations and skin safety.</p><div class="line"></div><p><strong>Your teaching strength</strong><br>${pr.strength}</p><p><strong>A question to carry with you</strong></p><p class="reflection">${pr.reflect}</p></div><div class="buttons"><button class="btn secondary" id="again">START AGAIN</button><button class="btn" id="share">SHARE RESULT</button></div><button class="btn secondary" style="margin-top:10px" id="copy">COPY SCENT NOTES</button><p class="footer">Your responses stay in this browser session. No tracking, accounts or Google Sheets connection. Teaching identities are reflective metaphors, not psychological diagnoses or professional evaluations. Some tie scores are resolved by a fixed order; results are not scientific measurements.</p>`;document.getElementById('again').onclick=()=>{answers=Array(16).fill(null);step=-1;render()};document.getElementById('copy').onclick=()=>copy(summary);document.getElementById('share').onclick=async()=>{if(navigator.share){try{await navigator.share({title:'The Scent of a Teacher',text:summary,url:location.href})}catch(e){}}else copy(summary+' '+location.href)}}
async function copy(s){try{await navigator.clipboard.writeText(s);alert('Copied to clipboard.')}catch(e){prompt('Copy your result:',s)}}render();
</script></body></html>
